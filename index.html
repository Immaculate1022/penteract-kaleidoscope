<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penteract Kaleidoscope — Infinite Recursive 5D Fractal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050510;
      color: #e0e0ff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.6rem 1rem;
      background: rgba(10, 10, 30, 0.85);
      border-bottom: 1px solid #2a2a5a;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
      z-index: 10;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
      font-size: 0.85rem;
    }
    label { display: flex; align-items: center; gap: 0.35rem; }
    input[type="range"] { width: 90px; accent-color: #818cf8; }
    button {
      background: #312e81;
      color: #e0e7ff;
      border: 1px solid #4f46e5;
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { background: #4338ca; }
    #canvas {
      flex: 1;
      width: 100%;
      display: block;
      background: radial-gradient(ellipse at center, #0a0a20 0%, #020208 70%);
    }
    .info {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Penteract Kaleidoscope</h1>
    <div class="controls">
      <label>Depth <input type="range" id="depth" min="0" max="3" value="2" step="1" /> <span id="depthVal">2</span></label>
      <label>Speed <input type="range" id="speed" min="0" max="3" value="1" step="0.1" /> <span id="speedVal">1.0</span></label>
      <label>Scale <input type="range" id="scale" min="40" max="200" value="110" step="5" /> <span id="scaleVal">110</span></label>
      <button id="toggle">Pause</button>
      <button id="reset">Reset</button>
    </div>
    <div class="info">5D recursive fractal • PHI rotations • each vertex holds a smaller penteract</div>
  </header>
  <canvas id="canvas"></canvas>

  <script>
    // ============================================================
    // PenteractEngine — 5D hypercube (penteract) primitives
    // ============================================================
    const PHI = (1 + Math.sqrt(5)) / 2;

    const PenteractEngine = {
      // 32 vertices of the unit 5-cube: all combinations of ±1 in 5 dimensions
      generateVertices() {
        const verts = [];
        for (let i = 0; i < 32; i++) {
          const v = [];
          for (let d = 0; d < 5; d++) {
            v.push(((i >> d) & 1) ? 1 : -1);
          }
          verts.push(v);
        }
        return verts;
      },

      // Edges: connect vertices that differ in exactly one coordinate
      generateEdges() {
        const verts = this.generateVertices();
        const edges = [];
        for (let i = 0; i < 32; i++) {
          for (let j = i + 1; j < 32; j++) {
            let diff = 0;
            for (let d = 0; d < 5; d++) {
              if (verts[i][d] !== verts[j][d]) diff++;
            }
            if (diff === 1) edges.push([i, j]);
          }
        }
        return edges;
      },

      // Rotate a set of 5D points by 10 plane angles (C(5,2)=10 planes)
      // angles: array of length 10 corresponding to planes (0,1),(0,2),(0,3),(0,4),
      //         (1,2),(1,3),(1,4),(2,3),(2,4),(3,4)
      rotate(vertices, angles) {
        const planes = [
          [0,1],[0,2],[0,3],[0,4],
          [1,2],[1,3],[1,4],
          [2,3],[2,4],
          [3,4]
        ];
        let result = vertices.map(v => [...v]);

        for (let p = 0; p < 10; p++) {
          const a = angles[p] || 0;
          if (Math.abs(a) < 1e-12) continue;
          const c = Math.cos(a);
          const s = Math.sin(a);
          const [i, j] = planes[p];
          result = result.map(v => {
            const vi = v[i], vj = v[j];
            const out = [...v];
            out[i] = vi * c - vj * s;
            out[j] = vi * s + vj * c;
            return out;
          });
        }
        return result;
      },

      // Project 5D → 2D via successive perspective projections
      // factor controls the perspective strength
      project(v5, factor = 2.5) {
        let [x, y, z, w, u] = v5;

        // 5D → 4D
        const d4 = factor + u;
        if (Math.abs(d4) < 1e-6) d4 = 1e-6;
        x /= d4; y /= d4; z /= d4; w /= d4;

        // 4D → 3D
        const d3 = factor + w;
        if (Math.abs(d3) < 1e-6) d3 = 1e-6;
        x /= d3; y /= d3; z /= d3;

        // 3D → 2D
        const d2 = factor + z;
        if (Math.abs(d2) < 1e-6) d2 = 1e-6;
        x /= d2; y /= d2;

        return [x, y];
      }
    };

    // ============================================================
    // KaleidoscopeEngine — recursive fractal version
    // ============================================================
    const KaleidoscopeEngine = {
      generateRecursiveVertices(depth = 2, scale = 1, offset = [0,0,0,0,0]) {
        if (depth === 0) return [offset];

        const vertices = [];
        const baseVerts = PenteractEngine.generateVertices();

        for (let i = 0; i < 32; i++) {
          const childOffset = offset.map((coord, dim) =>
            coord + baseVerts[i][dim] * scale
          );
          const subVerts = KaleidoscopeEngine.generateRecursiveVertices(
            depth - 1,
            scale * 0.45,   // slightly stronger nesting
            childOffset
          );
          vertices.push(...subVerts);
        }
        return vertices;
      },

      recursiveRotate(vertices, depth, time, speed = 1) {
        if (depth === 0) return vertices;

        const angleOffset = depth * PHI * 0.08;
        const angles = Array.from({ length: 10 }, (_, i) =>
          time * 0.18 * speed * Math.pow(PHI, (i + depth) * 0.35) + angleOffset
        );

        let rotated = PenteractEngine.rotate(vertices, angles);

        // Per-chunk secondary rotations (kaleidoscope mirrors)
        const chunkSize = Math.pow(32, depth);
        const result = [];
        for (let i = 0; i < rotated.length; i += chunkSize) {
          const chunk = rotated.slice(i, i + chunkSize);
          const subAngles = Array.from({ length: 10 }, (_, j) =>
            time * 0.12 * speed * Math.pow(PHI, j * 0.4 + (i % 7) * 0.05)
          );
          result.push(...PenteractEngine.rotate(chunk, subAngles));
        }
        return result;
      },

      projectRecursive(v5, depth, factor = 2.8) {
        const depthFactor = factor + depth * 0.25;
        return PenteractEngine.project(v5, depthFactor);
      },

      generateRecursiveEdges(depth) {
        if (depth <= 0) return [];

        const edges = [];
        const totalVerts = Math.pow(32, depth);
        const childSize = Math.pow(32, depth - 1);
        const baseEdges = PenteractEngine.generateEdges();

        // Edges inside each sub-penteract
        for (let i = 0; i < totalVerts; i += childSize) {
          baseEdges.forEach(([a, b]) => {
            edges.push([i + a, i + b]);
          });
        }

        // Light cross-connections between neighboring sub-structures
        // (limited to keep edge count reasonable)
        for (let i = 0; i < totalVerts; i += childSize) {
          const j = i + childSize;
          if (j >= totalVerts) break;
          // Connect only a few corresponding vertices to avoid explosion
          for (let k = 0; k < Math.min(8, childSize); k++) {
            edges.push([i + k, j + k]);
          }
        }
        return edges;
      },

      renderRecursive(ctx, vertices2D, depth, width, height, scale = 110) {
        const centerX = width / 2;
        const centerY = height / 2;

        ctx.clearRect(0, 0, width, height);

        const edges = this.generateRecursiveEdges(depth);
        const childSize = Math.pow(32, Math.max(0, depth - 1));

        // Draw edges
        edges.forEach(([i, j]) => {
          const p1 = vertices2D[i];
          const p2 = vertices2D[j];
          if (!p1 || !p2 || !isFinite(p1[0]) || !isFinite(p1[1]) || !isFinite(p2[0]) || !isFinite(p2[1])) return;

          const depthEst = Math.floor(i / childSize);
          const hue = (depthEst * 42 + i * 0.07) % 360;
          const lightness = 55 + 25 * (1 - depthEst / Math.max(1, depth));
          const alpha = Math.max(0.12, 0.85 - depthEst / (depth + 1.5));

          ctx.strokeStyle = `hsla(${hue}, 90%, ${lightness}%, ${alpha})`;
          ctx.lineWidth = Math.max(0.4, 1.4 - depthEst * 0.25);
          ctx.beginPath();
          ctx.moveTo(centerX + p1[0] * scale, centerY + p1[1] * scale);
          ctx.lineTo(centerX + p2[0] * scale, centerY + p2[1] * scale);
          ctx.stroke();
        });

        // Draw glowing vertices
        vertices2D.forEach((v, i) => {
          if (!v || !isFinite(v[0]) || !isFinite(v[1])) return;

          const depthEst = Math.floor(i / childSize);
          const hue = (depthEst * 42 + i * 0.07) % 360;
          const size = Math.max(1.2, 2.8 - depthEst * 0.45);

          const gx = centerX + v[0] * scale;
          const gy = centerY + v[1] * scale;

          const gradient = ctx.createRadialGradient(gx, gy, 0, gx, gy, size * 3.5);
          gradient.addColorStop(0, `hsla(${hue}, 100%, 85%, 0.75)`);
          gradient.addColorStop(1, `hsla(${hue}, 90%, 50%, 0)`);

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(gx, gy, size * 3.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = `hsla(${hue}, 100%, 92%, 0.95)`;
          ctx.beginPath();
          ctx.arc(gx, gy, size, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    };

    // ============================================================
    // Animation driver
    // ============================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let maxDepth = 2;
    let speed = 1;
    let drawScale = 110;
    let time = 0;
    let running = true;
    let animId = null;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - document.querySelector('header').offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // UI bindings
    const depthSlider = document.getElementById('depth');
    const speedSlider = document.getElementById('speed');
    const scaleSlider = document.getElementById('scale');
    const depthVal = document.getElementById('depthVal');
    const speedVal = document.getElementById('speedVal');
    const scaleVal = document.getElementById('scaleVal');

    depthSlider.addEventListener('input', () => {
      maxDepth = +depthSlider.value;
      depthVal.textContent = maxDepth;
    });
    speedSlider.addEventListener('input', () => {
      speed = +speedSlider.value;
      speedVal.textContent = speed.toFixed(1);
    });
    scaleSlider.addEventListener('input', () => {
      drawScale = +scaleSlider.value;
      scaleVal.textContent = drawScale;
    });

    document.getElementById('toggle').addEventListener('click', function () {
      running = !running;
      this.textContent = running ? 'Pause' : 'Play';
      if (running) loop();
    });

    document.getElementById('reset').addEventListener('click', () => {
      time = 0;
    });

    function loop() {
      if (!running) return;

      time += 0.006 * speed;

      // Generate + project + rotate for the current depth only
      // (deeper depths explode combinatorially; we keep it practical)
      const verts5 = KaleidoscopeEngine.generateRecursiveVertices(maxDepth, 1);
      const rotated = KaleidoscopeEngine.recursiveRotate(verts5, maxDepth, time, speed);
      const projected = rotated.map(v =>
        KaleidoscopeEngine.projectRecursive(v, maxDepth, 2.9)
      );

      KaleidoscopeEngine.renderRecursive(
        ctx, projected, maxDepth,
        canvas.width, canvas.height, drawScale
      );

      animId = requestAnimationFrame(loop);
    }

    // Start
    loop();
  </script>
</body>
</html>
